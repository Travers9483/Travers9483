  <title id="title">Tech I use</title>
  <desc id="desc">Working with: Languages: C++, C#, TypeScript, JavaScript, PowerShell, Python, Lua. Graphics &amp; games: DirectX 9 · 11 · 12, OpenGL, Unreal, Unity. Reverse engineering: IDA Pro, Ghidra, x64dbg, Cheat Engine, ReClass.NET, Process Hacker. Network &amp; debugging: Wireshark, Fiddler, HTTP Debugger. Web: HTML &amp; CSS, Node.js, Leaflet, Supabase, Netlify. Microsoft 365: SharePoint (SPFx), Power Apps, Power Automate. Creative &amp; video: Photoshop, InDesign, After Effects, VEGAS Pro, OBS Studio. Dev tools: Visual Studio, VS Code, Git, GitHub, Claude &amp; MCP. Exploring: Vulkan, DirectX 12 internals, VR &amp; OpenXR, Game telegraphs, Model geometry.</desc>
