  <title id="title">Tech I use</title>
  <desc id="desc">Working with: Languages: C++, C#, TypeScript, JavaScript, PowerShell, Python, Lua, HLSL. Graphics &amp; VR: DirectX 9 · 11 · 12, OpenGL, Vulkan, OpenXR. Game engines: Unreal 4 · 5, Unity, Frostbite, 4A Engine, CryEngine, Decima, Saber Swarm, Volition CTG, RAGE. Reverse engineering: IDA Pro, Ghidra, x64dbg, Cheat Engine, ReClass.NET, Process Hacker. Network &amp; debugging: Wireshark, Fiddler, HTTP Debugger. Web: HTML &amp; CSS, Node.js, Leaflet, Supabase, Netlify. Microsoft 365: SharePoint (SPFx), Power Apps, Power Automate, Microsoft Teams. Creative &amp; video: Photoshop, InDesign, After Effects, VEGAS Pro, OBS Studio. Dev tools: Visual Studio, VS Code, Git, GitHub, Claude &amp; MCP. Exploring: DirectX 12 internals, Game telegraphs, Model geometry, id Tech, Dunia, Source.</desc>
