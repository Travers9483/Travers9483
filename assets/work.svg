<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" role="img" aria-labelledby="title desc">
  <title id="title">What I work on</title>
  <desc id="desc">Graphics &amp; GUI: NovaGui, my own immediate-mode GUI library, with DirectX 9 / 11 / 12, OpenGL and Vulkan. Game tech &amp; modding: In-game overlays, trainers and VR mods for single-player games on Unreal and Unity. Reverse engineering: Understanding compiled code, tracing behaviour, inspecting game assets, documenting findings. Game-data visualisation: Turning extracted game data into overlays and visual cues, like attack telegraphs. Developer tooling: Debugging utilities, reusable components and integrations that cut repetitive work. AI-assisted dev tools: MCP servers that let AI assistants drive real debugging and analysis tools. Microsoft 365 &amp; automation: SPFx web parts, Power Apps and Power Automate, plus scripts linking M365 and creative apps. Web apps: Fast static sites, interactive maps and review tools: Leaflet, Supabase, Netlify.</desc>
