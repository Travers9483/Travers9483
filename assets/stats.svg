      <rect x=".75" y=".75" width="158.5" height="120.5" rx="16" fill="url(#s0)" fill-opacity=".07"/>
      <text class="n" x="80" y="52" text-anchor="middle" fill="url(#s0)">70+</text>
      <text class="l" x="80" y="80" text-anchor="middle">repositories,</text>
      <text class="l" x="80" y="100" text-anchor="middle">mostly private</text>
    </g></g>
    <g transform="translate(185 10)"><g class="c" style="animation-delay:0.16s">
      <rect x=".75" y=".75" width="158.5" height="120.5" rx="16" fill="#0f1424" stroke="url(#s1)" stroke-width="1.5"/>
