<svg xmlns="http://www.w3.org/2000/svg" width="880" height="262" viewBox="0 0 880 262" role="img" aria-labelledby="title desc">
  <title id="title">Right now</title>
  <desc id="desc">Refining NovaGui and its reusable menu components. Exploring game telegraphs, model geometry and visualisation. Connecting AI assistants to debugging and analysis tools (MCP). Building SharePoint components and workflow automation.</desc>
  <style>
    .t{font:500 16px ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .bar{font:600 13px 'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#64748b}
    .ln{animation:type .5s ease-out both}
    @keyframes type{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs><clipPath id="win"><rect width="880" height="262" rx="16"/></clipPath></defs>
  <g clip-path="url(#win)">
    <rect width="880" height="262" fill="#0b1020"/>
    <rect width="880" height="38" fill="#121933"/>
    <circle cx="24" cy="19" r="6" fill="#ff5f57"/><circle cx="44" cy="19" r="6" fill="#febc2e"/><circle cx="64" cy="19" r="6" fill="#28c840"/>
    <text class="bar" x="440" y="24" text-anchor="middle">now.md</text>
    <text class="t ln" style="animation-delay:.2s" x="28" y="78"><tspan fill="#4ade80">travers</tspan><tspan fill="#64748b">@</tspan><tspan fill="#a78bfa">dev</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#e2e8f0">cat now.md</tspan></text>
    <text class="t ln" style="animation-delay:0.70s" x="28" y="114"><tspan fill="#f472b6">▸ </tspan><tspan fill="#e2e8f0">Refining NovaGui and its reusable menu components</tspan></text>
    <text class="t ln" style="animation-delay:1.15s" x="28" y="144"><tspan fill="#22d3ee">▸ </tspan><tspan fill="#e2e8f0">Exploring game telegraphs, model geometry and visualisation</tspan></text>
    <text class="t ln" style="animation-delay:1.60s" x="28" y="174"><tspan fill="#fbbf24">▸ </tspan><tspan fill="#e2e8f0">Connecting AI assistants to debugging and analysis tools (MCP)</tspan></text>
    <text class="t ln" style="animation-delay:2.05s" x="28" y="204"><tspan fill="#4ade80">▸ </tspan><tspan fill="#e2e8f0">Building SharePoint components and workflow automation</tspan></text>
    <text class="t ln" style="animation-delay:2.50s" x="28" y="242"><tspan fill="#4ade80">travers</tspan><tspan fill="#64748b">@</tspan><tspan fill="#a78bfa">dev</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#e2e8f0">▌<animate attributeName="fill-opacity" values="1;0;1" keyTimes="0;.5;1" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
  </g>
  <rect x=".75" y=".75" width="878.5" height="260.5" rx="16" fill="none" stroke="#232c46" stroke-width="1.5"/>
</svg>